name: Zalos
description: >-
  Zalos is a Y Combinator-backed (F25) company building AI "computer agents" for
  finance operations. Rather than integrating through APIs, its agents log into a
  company's existing systems — ERPs, accounting platforms, banks, invoicing and CFO
  tools such as NetSuite and SAP — and operate the user interface the way a human
  would, learned from screen recordings. Zalos automates repetitive, multi-step
  finance workflows including reconciliation, transaction categorization, billing,
  form filling, month-end close and cross-system KPI reporting, while building a
  living process graph of an organization's finance operations for documentation and
  compliance. Founded in 2025 by William Fairbairn (CEO) and Hung Hoang (CTO,
  previously Apple Pay), the company is based in London and San Francisco and raised
  a $3.6M seed round led by 14 Peaks. Because Zalos operates entirely through
  computer-use automation of third-party interfaces, it does not currently publish a
  public developer API, OpenAPI definition, SDKs or developer portal.
